spring.application.name=jello_app

spring.datasource.url=jdbc:postgresql://localhost:5432/jello_app
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

## FLYWAY PROPERTIES
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
## spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
logging.level.org.flywaydb=DEBUG

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_ID}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.mime.charset=UTF
spring.mail.properties.mail.mime.smtp.writetimeout=10000
spring.mail.properties.mail.mime.smtp.connectiontimeout=10000
spring.mail.properties.mail.mime.smtp.timeout=10000
spring.mail.properties.mail.mime.smtp.auth=true
spring.mail.properties.mail.mime.smtp.starttls.enable=true
spring.mail.properties.mail.mime.smtp.starttls.required=true
spring.mail.properties.verify.host=${VERIFY_EMAIL_HOST}

auth.token.jwtSecret=QmFzZTY0U2VjcmV0S2V5VGVzdDEyMzQ1Njc4OTAxMjM0NTY3OA==
auth.token.expirationInMils=3600000

api.prefix=/api/v1

frontend.url=http://localhost:5173